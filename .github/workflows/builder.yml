name: Builders

on:
  push:
    branches: [ master ]
    tags: [ '**' ]
  pull_request:
    branches: [ master ]

jobs:
  tester:
    name: Test runner linux build
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install zlib1g zlib1g-dev libsdl2-2.0-0 libsdl2-dev libopenal1 libopenal-dev libsdl2-mixer-dev libfreetype6 libfreetype6-dev libvlc-dev libpng16-16 libpng-dev libvorbis0a libvorbis-dev python3-dev zstd g++-9 gdb libgtest-dev

        SCCACHE_VERSION="v0.2.15"
        SCCACHE_LINUX_PACKAGE="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
        curl -sSfL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${SCCACHE_LINUX_PACKAGE}.tar.gz" | sudo tar zx --strip-component=1 -C /usr/bin/
        chmod +x /usr/bin/sccache

    - name: Set up build
      env:
        CXX: g++-9
        CC: gcc-9
      run: |
        mkdir build && cd build
        cmake --version
        cmake .. -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DUSE_TESTS=ON

    - name: Compiler cache (sccache)
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/sccache
          ~/Library/Caches/Mozilla.sccache
        key: ${{ runner.os }}-sccache-v1-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-sccache-v1-${{ github.ref }}-
          ${{ runner.os }}-sccache-v1-refs/heads/master-
          ${{ runner.os }}-sccache-v1-

    - name: Build
      run: |
        cd build
        make

    - name: Test Suite
      run: |
        cd build
        xvfb-run make test

  windows:
    name: Test runner Windows MSVC build
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Checkout vcpkg
      uses: actions/checkout@v6
      with:
        repository: microsoft/vcpkg
        # Use supported bootstrap tools; the manifest retains its pinned ports.
        # vcpkg 2026.07.29 (the 2022 bootstrap downloads a removed 7-Zip archive).
        ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
        path: vcpkg

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        architecture: x64

    - name: Set up build tools
      run: |
        # The pinned dependency ports predate CMake 4 policy removals.
        python -m pip install cmake==3.31.6
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # Use native executables so PYTHONHOME cannot break pip's launchers.
        python -c "import cmake; print(cmake.CMAKE_BIN_DIR)" >> $env:GITHUB_PATH
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: windows-msvc-vcpkg-v1-${{ hashFiles('platforms/windows/vcpkg.json') }}-${{ github.sha }}
        restore-keys: |
          windows-msvc-vcpkg-v1-${{ hashFiles('platforms/windows/vcpkg.json') }}-

    - name: Set up build
      run: |
        $dependencies = "$env:GITHUB_WORKSPACE/build/vcpkg_installed/x64-windows"
        # Existing CTest commands capture PATH at configure time.
        $env:PATH = "$dependencies/bin;$dependencies/tools/python3;$env:PATH"
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release -DUSE_TESTS=ON `
          "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          "-DPYTHON_VERSION=3.10...<3.11" `
          "-DPython3_EXECUTABLE=$env:pythonLocation/python.exe"

    - name: Build
      run: cmake --build build --config Release --parallel 2

    - name: Test Suite
      run: |
        $dependencies = "$env:GITHUB_WORKSPACE/build/vcpkg_installed/x64-windows"
        $env:PATH = "$dependencies/bin;$dependencies/tools/python3;$env:PATH"
        ctest --test-dir build -C Release --output-on-failure --no-tests=error

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-msvc-test-logs
        path: build/Testing/Temporary/
        if-no-files-found: ignore

  macos:
    if: false
    name: MacOS build
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Homebrew
      run: |
        brew install sdl2 openal-soft sdl2_mixer libpng libvorbis sccache googletest

    - name: Set up build
      run: |
        # FindOpenAL prefers the framework version by default ... which deprecated OpenAL
        openal="-DOPENAL_INCLUDE_DIR=/usr/local/opt/openal-soft/include/AL -DOPENAL_LIBRARY=/usr/local/opt/openal-soft/lib/libopenal.dylib"
        mkdir build && cd build &&
        export OPENALDIR="/usr/local/opt/openal-soft/" &&
        cmake --version &&
        cmake -DCMAKE_INSTALL_PREFIX=iprefix $openal -DCMAKE_FIND_FRAMEWORK=LAST -DUSE_OPENAL=off -DUSE_TESTS=ON ..
        grep -i openal CMakeCache.txt

    - name: Compiler cache (sccache)
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/sccache
          ~/Library/Caches/Mozilla.sccache
        key: ${{ runner.os }}-sccache-v1-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-sccache-v1-${{ github.ref }}-
          ${{ runner.os }}-sccache-v1-refs/heads/master-
          ${{ runner.os }}-sccache-v1-

    - name: Build & Test
      run: |
        cd build &&
        make &&
        make test &&
        # try to only run on tag pushes
        if grep -q '^v[01]\.[0-9].[0-9]' <<< "${GITHUB_REF}"; then make fetch-demo-data; fi &&
        make install

    - name: Show build cache stats
      run: |
        command -v sccache &&
        sccache -s

    - name: Set up SSH
      uses: kielabokkie/ssh-key-and-known-hosts-action@151931a36dd69934d46acc72b38939737db04e6f
      if: github.event_name == 'push' && github.repository == 'gemrb/gemrb'
      with:
        ssh-private-key: ${{ secrets.SSH_SF_PRIVATE_KEY }}
        ssh-host: frs.sourceforge.net

    - name: Upload
      if: github.event_name == 'push' && github.repository == 'gemrb/gemrb'
      run: |
        # NOTE: only do it on clang builds if we ever add more compilers
        filepath=Apple/OSX
        tarpath=/Applications/gemrb.app

        # there are no tags, so improvise
        version=$({ date +%F; git describe --always; } | tr -d '\n') || exit 14
        file=gemrb-$version.tar.bz2
        tar cjf $file $tarpath || exit 15

        filepath="$filepath/$file"
        scp -v "$file" \
        "gemrb-travisbot@frs.sourceforge.net:/home/frs/project/gemrb/botbins/$filepath"

  linux:
    name: Linux AppImage build
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install zlib1g zlib1g-dev libsdl2-2.0-0 libsdl2-dev libopenal1 libopenal-dev libsdl2-mixer-dev libfreetype6 libfreetype6-dev libvlc-dev libpng16-16 libpng-dev libvorbis0a libvorbis-dev python3-dev zstd g++-9 gdb libgtest-dev

        SCCACHE_VERSION="v0.2.15"
        SCCACHE_LINUX_PACKAGE="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
        curl -sSfL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${SCCACHE_LINUX_PACKAGE}.tar.gz" | sudo tar zx --strip-component=1 -C /usr/bin/
        chmod +x /usr/bin/sccache

    - name: Set up build
      env:
        CXX: g++-9
        CC: gcc-9
      run: |
        mkdir build && cd build
        cmake --version
        cmake .. -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DSTATIC_LINK=1 -DAPPIMAGE=1 -DUSE_TESTS=ON

    - name: Compiler cache (sccache)
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/sccache
          ~/Library/Caches/Mozilla.sccache
        key: ${{ runner.os }}-sccache-v1-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-sccache-v1-${{ github.ref }}-
          ${{ runner.os }}-sccache-v1-refs/heads/master-
          ${{ runner.os }}-sccache-v1-

    - name: Build
      run: |
        cd build
        make
        # install big demo data only on tag pushes
        if grep -q '^v[01]\.[0-9].[0-9]' <<< "${GITHUB_REF}"; then make fetch-demo-data; fi
        # create a debugging runner, since xvfb runs one command per process only
        echo "ulimit -Sc unlimited; sudo sysctl -w kernel.core_pattern=$PWD/core-%e" >> run-or-dump.sh
        echo 'if ! gemrb/gemrb -q --color 2 -c ../gemrb/GemRB.cfg.noinstall.sample; then' >> run-or-dump.sh
        echo 'gdb -q -c core-* -ex bt -ex q -batch --args gemrb/gemrb -q -c ../gemrb/GemRB.cfg.noinstall.sample' >> run-or-dump.sh
        echo "exit 1; fi" >> run-or-dump.sh
        chmod +x run-or-dump.sh

    - name: Test Run
      run: |
        cd build
        xvfb-run ./run-or-dump.sh

    - name: Prepare AppImage
      run: |
        cd build
        # fetch appimage tools
        curl https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -L -o linuxdeploy
        chmod +x linuxdeploy

        echo "::group::AppImage building"
        make appimage
        ln -s GemRB-*.AppImage grrr-gemrb.AppImage # workaround for xvfb
        echo "::endgroup::"

    - name: Test AppImage
      run: |
        cd build
        xvfb-run ./grrr-gemrb.AppImage -q ../gemrb/tests/minimal/

    - name: Show build cache stats
      run: |
        command -v sccache
        sccache -s

    - name: Set up SSH
      uses: kielabokkie/ssh-key-and-known-hosts-action@151931a36dd69934d46acc72b38939737db04e6f
      if: github.event_name == 'push' && github.repository == 'gemrb/gemrb'
      with:
        ssh-private-key: ${{ secrets.SSH_SF_PRIVATE_KEY }}
        ssh-host: frs.sourceforge.net

    - name: Upload
      if: github.event_name == 'push' && github.repository == 'gemrb/gemrb'
      run: |
        # NOTE: only do it on gcc builds if we ever add more compilers
        filepath=Linux
        filei=build/GemRB-*.AppImage
        fileo=GemRB-$(date +%F)-${GITHUB_REF##*/}-${GITHUB_SHA:0:10}-x86_64.AppImage

        filepath="$filepath/$fileo"
        scp $filei \
        gemrb-travisbot@frs.sourceforge.net:/home/frs/project/gemrb/Buildbot\\\ Binaries/$filepath
