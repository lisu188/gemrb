name: Companion acceptance

on:
  push:
    branches: [master, feat/persistent-companion]
    paths:
      - 'gemrb/plugins/GUIScript/**'
      - 'gemrb/core/**'
      - 'gemrb/tests/GUIScripts/*companion*'
      - 'gemrb/CMakeLists.txt'
      - '.github/workflows/companion.yml'
  pull_request:
    branches: [master]
    paths:
      - 'gemrb/plugins/GUIScript/**'
      - 'gemrb/core/**'
      - 'gemrb/tests/GUIScripts/*companion*'
      - 'gemrb/CMakeLists.txt'
      - '.github/workflows/companion.yml'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libsdl2-dev libopenal-dev libsdl2-mixer-dev libfreetype6-dev libpng-dev libvorbis-dev python3-dev libgtest-dev xvfb
      - name: Build engine and all native tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_TESTS=ON
          cmake --build build --parallel 2
      - name: Preserve exact build for reproducible acceptance diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/companion-runtime"
          git archive --format=tar HEAD > "$RUNNER_TEMP/companion-runtime/source.tar"
          find build/gemrb \( -type f -o -type l \) \( -name '*.so*' -o -name gemrb \) -print0 | sort -z | tar --null -T - -czf "$RUNNER_TEMP/companion-runtime/native.tar.gz"
          cp /usr/lib/x86_64-linux-gnu/libpython3.12.so.1.0 "$RUNNER_TEMP/companion-runtime/"
          cp /usr/share/doc/libpython3.12-stdlib/copyright "$RUNNER_TEMP/companion-runtime/python-copyright"
          tar -C /usr -czf "$RUNNER_TEMP/companion-runtime/python.tar.gz" lib/python3.12
          git rev-parse HEAD > "$RUNNER_TEMP/companion-runtime/revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: companion-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/companion-runtime/*
          retention-days: 7
      - name: Run CTest
        run: xvfb-run -a ctest --test-dir build --output-on-failure --no-tests=error
      - name: Run actual companion save and reload
        run: |
          xvfb-run -a python3 gemrb/tests/GUIScripts/companion_demo.py --engine . --binary build/gemrb/gemrb --plugins build/gemrb/plugins --output "$RUNNER_TEMP/companion-live"
      - name: Collect validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-acceptance-${{ github.sha }}
          path: |
            build/Testing/Temporary/
            ${{ runner.temp }}/companion-live/engine.log
            ${{ runner.temp }}/companion-live/companion-report.json
          if-no-files-found: ignore
          retention-days: 14
