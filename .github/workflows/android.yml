name: Android

on:
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'gemrb/**'
      - 'platforms/android/**'
  push:
    branches:
      - android-modernization
    paths:
      - '.github/workflows/android.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'gemrb/**'
      - 'platforms/android/**'

permissions:
  contents: read

jobs:
  android-debug:
    name: ${{ matrix.abi }} debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - x86_64
    env:
      GEMRB_ANDROID_ABI: ${{ matrix.abi }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test Android path isolation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gemrb-android-java-test
          mkdir -p /tmp/gemrb-android-java-test
          javac -d /tmp/gemrb-android-java-test \
            platforms/android/app/src/main/java/org/gemrb/gemrb/GamePaths.java \
            platforms/android/app/src/main/java/org/gemrb/gemrb/ManagedConfig.java \
            platforms/android/tests/org/gemrb/gemrb/GamePathsTest.java
          java -cp /tmp/gemrb-android-java-test org.gemrb.gemrb.GamePathsTest

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;29.0.14206865' \
            'cmake;3.31.6'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare native dependencies
        working-directory: platforms/android
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prefetch-mirrors.sh
          bash scripts/prepare-dependencies.sh
          bash scripts/prepare-openal.sh

      - name: Assemble debug APK
        working-directory: platforms/android
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug -PgemrbAbi="${GEMRB_ANDROID_ABI}" --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/android-build-${GEMRB_ANDROID_ABI}.log"

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log-${{ matrix.abi }}
          path: android-build-${{ matrix.abi }}.log
          if-no-files-found: warn

      - name: Validate packaged native libraries
        working-directory: platforms/android
        run: bash scripts/validate-native-libs.sh app/build/outputs/apk/debug/app-debug.apk "${GEMRB_ANDROID_ABI}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemrb-android-${{ matrix.abi }}-debug
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

  x86_64-emulator-smoke:
    name: x86_64 emulator smoke
    needs: android-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gemrb-android-x86_64-debug
          path: android-artifact

      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch bundled demo on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: GEMRB_ANDROID_SMOKE_LOG="$GITHUB_WORKSPACE/gemrb-emulator.log" bash platforms/android/scripts/smoke-emulator.sh android-artifact/app-debug.apk

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemrb-android-x86_64-emulator-log
          path: gemrb-emulator.log
          if-no-files-found: warn
