name: Companion integration bootstrap
on:
  push:
    branches: [feat/persistent-companion]
    paths: [.github/workflows/companion-bootstrap.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve CRE serialized companion names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gemrb/plugins/GUIScript/CompanionBindings.h')
          s = p.read_text()
          assert s.count('companion->SetScriptName(ieVariable());') == 1
          assert s.count('fresh->SetScriptName(name);') == 1
          s = s.replace('companion->SetScriptName(ieVariable());', 'companion->SetScriptName(ieVariable());\n\tcompanion->ignoredFields.origScriptName.Reset();')
          s = s.replace('fresh->SetScriptName(name);', 'fresh->SetScriptName(name);\n\t\t\tfresh->ignoredFields.origScriptName = name;')
          p.write_text(s)
          p = Path('gemrb/tests/GUIScripts/test_companion.py')
          s = p.read_text().replace('using std::string::string;', 'using std::string::string;\n    void Reset() { clear(); }')
          s = s.replace('ieVariable name;', 'ieVariable name;\n    struct { ieVariable origScriptName; } ignoredFields;')
          s = s.replace('a->id=9009; owner.id=8008; a->objects.LastSummoner=0;', 'a->id=9009; owner.id=8008; a->objects.LastSummoner=0; a->name=a->ignoredFields.origScriptName;')
          p.write_text(s)
          PY
          clang-format -i gemrb/plugins/GUIScript/CompanionBindings.h
      - name: Validate actual binding before publication
        run: |
          python3 gemrb/tests/GUIScripts/test_companion.py --generate /tmp/companion.cpp
          c++ -std=c++17 -Wall -Wextra -Werror /tmp/companion.cpp $(python3-config --includes --embed --ldflags) -o /tmp/companion
          python3 gemrb/tests/GUIScripts/test_companion.py --binary /tmp/companion
          git diff --check
      - name: Publish validated source and remove temporary workflow
        run: |
          test "$GITHUB_REF" = refs/heads/feat/persistent-companion
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gemrb/plugins/GUIScript/CompanionBindings.h gemrb/tests/GUIScripts/test_companion.py
          git rm .github/workflows/companion-bootstrap.yml
          git commit -m 'Preserve serialized companion identity and remove implementation bootstrap'
          git push origin HEAD:refs/heads/feat/persistent-companion
          git archive --format=tar HEAD > /tmp/companion-engine.tar
      - uses: actions/upload-artifact@v4
        with:
          name: companion-engine-source
          path: /tmp/companion-engine.tar
          retention-days: 7
