<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BGEE on Android - GemRB screenshot gallery</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #101114;
      color: #f3f4f6;
    }
    body {
      max-width: 1500px;
      margin: 0 auto;
      padding: 2rem;
    }
    h1 { margin-bottom: 0.35rem; }
    header p { color: #b8bec9; margin-top: 0; }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr));
      gap: 1.5rem;
    }
    figure {
      margin: 0;
      padding: 0.75rem;
      border: 1px solid #30343b;
      border-radius: 0.6rem;
      background: #191b20;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 0.25rem;
    }
    figcaption { padding: 0.65rem 0.2rem 0.1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Baldur's Gate: Enhanced Edition on Android</h1>
    <p>GemRB running on an Android API 36 x86_64 emulator at 1280x720.</p>
  </header>
  <main>
    <figure><img src="01-campaign-selection.png" alt="BGEE campaign selection"><figcaption>01. Campaign selection</figcaption></figure>
    <figure><img src="02-main-menu.png" alt="BGEE main menu"><figcaption>02. Main menu</figcaption></figure>
    <figure><img src="03-single-player-menu.png" alt="BGEE single-player menu"><figcaption>03. Single-player menu</figcaption></figure>
    <figure><img src="04-chapter-5-gameplay.png" alt="BGEE Chapter 5 gameplay"><figcaption>04. Chapter 5 gameplay</figcaption></figure>
    <figure><img src="05-inventory.png" alt="BGEE inventory"><figcaption>05. Inventory</figcaption></figure>
    <figure><img src="06-character-record.png" alt="BGEE character record"><figcaption>06. Character record</figcaption></figure>
    <figure><img src="07-journal.png" alt="BGEE journal"><figcaption>07. Journal</figcaption></figure>
    <figure><img src="08-area-map.png" alt="BGEE area map"><figcaption>08. Area map</figcaption></figure>
    <figure><img src="09-wizard-spells.png" alt="BGEE wizard spells"><figcaption>09. Wizard spells</figcaption></figure>
    <figure><img src="10-priest-spells.png" alt="BGEE priest spells"><figcaption>10. Priest spells</figcaption></figure>
    <figure><img src="11-in-game-options.png" alt="BGEE in-game options"><figcaption>11. In-game options</figcaption></figure>
    <figure><img src="12-startup-options.png" alt="BGEE startup options"><figcaption>12. Startup options</figcaption></figure>
    <figure><img src="13-load-game-browser.png" alt="BGEE saved-game browser"><figcaption>13. Load-game browser</figcaption></figure>
    <figure><img src="14-character-generation.png" alt="BGEE character generation"><figcaption>14. Character generation</figcaption></figure>
    <figure><img src="15-character-gender.png" alt="BGEE character gender selection"><figcaption>15. Character gender selection</figcaption></figure>
  </main>
</body>
</html>
